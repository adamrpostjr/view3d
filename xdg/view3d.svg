<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3542"/>
      <stop offset="1" stop-color="#00191f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="1" stop-color="#d9d3c0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- An isometric cube: the three visible faces of a mesh model. -->
  <g transform="translate(64 66)">
    <polygon points="0,-42 42,-18 0,6 -42,-18" fill="url(#face)"/>
    <polygon points="-42,-18 0,6 0,48 -42,24" fill="#8fa3a8"/>
    <polygon points="42,-18 0,6 0,48 42,24" fill="#647c82"/>
    <!-- Wireframe hint on the top face. -->
    <g stroke="#0a3542" stroke-width="1.5" opacity="0.55" fill="none">
      <path d="M-21,-30 L21,-6 M21,-30 L-21,-6 M0,-42 L0,6 M-42,-18 L42,-18"/>
    </g>
  </g>
</svg>
